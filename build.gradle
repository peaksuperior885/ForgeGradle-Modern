plugins {
    id 'java'
    id 'java-gradle-plugin'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.cadixdev.licenser' version '0.6.1'
}

group = 'dev.peak885.gradle'
version = '0.1.2'

base {
    archivesName = 'ForgeGradleModern'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'quilt'
        url = 'https://maven.quiltmc.org/repository/release/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
    maven {
        name = 'mojang'
        url = 'https://libraries.minecraft.net/'
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'com.mojang'
            includeGroup 'net.minecraft'
        }
    }
    maven {
        name = 'papermc'
        url = 'https://artifactory.papermc.io/artifactory/universe/'
    }
    maven { url = 'https://hlnconsulting.jfrog.io/artifactory/libs-release/' }
}

configurations {
    shade
    implementation.extendsFrom(shade)

    javadocClasspath {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom(compileOnly)
    }
}

dependencies {
    compileOnly gradleApi()

    shade 'com.google.guava:guava:33.3.1-jre'
    shade 'com.google.code.gson:gson:2.11.0'
    shade 'org.apache.httpcomponents:httpclient:4.5.14'
    shade 'org.apache.httpcomponents:httpmime:4.5.14'
    shade 'com.github.tony19:named-regexp:1.0.0'
    shade 'com.cloudbees:diff4j:1.3'

    shade 'org.ow2.asm:asm:9.7.1'
    shade 'org.ow2.asm:asm-commons:9.7.1'
    shade 'org.ow2.asm:asm-tree:9.7.1'
    shade 'org.ow2.asm:asm-util:9.7.1'
    shade 'org.ow2.asm:asm-analysis:9.7.1'

    shade 'net.minecraftforge:fernflower:2.0-SNAPSHOT'
    shade 'net.md-5:SpecialSource:1.11.4'

    shade 'net.sf.opencsv:opencsv:2.3'
    shade 'com.github.abrarsyed.jastyle:jAstyle:1.3'
    shade 'net.sf.trove4j:trove4j:3.0.3'
    shade 'com.github.jponge:lzma-java:1.3'
    shade 'com.nothome:javaxdelta:2.0.1'
    shade 'de.oceanlabs.mcp:RetroGuard:3.6.6'
    shade 'de.oceanlabs.mcp:mcinjector:3.4-SNAPSHOT'
    shade 'net.minecraftforge.srg2source:Srg2Source:3.3-SNAPSHOT'
    shade 'org.eclipse.jdt:org.eclipse.jdt.core:3.10.0'

    compileOnly 'com.mojang:authlib:1.5.25'
    compileOnly 'net.minecraft:launchwrapper:1.12'

    testImplementation gradleApi()
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        compileClasspath += configurations.shade
        runtimeClasspath += configurations.shade
    }
    test {
        compileClasspath += configurations.shade
        runtimeClasspath += configurations.shade
    }
}

tasks.withType(JavaCompile).configureEach {
    options.deprecation = true
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    filesMatching('forgegradle.version.txt') {
        expand(version: project.version)
    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [project.configurations.shade]
    archiveClassifier.set('') // Keeps the main jar filename without a '-all' suffix
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/SIG-*'

    manifest {
        attributes(
                'version': project.version,
                'javaCompliance': project.targetCompatibility,
                'group': project.group,
                'Implementation-Version': project.version
        )
    }
}

tasks.named('jar', Jar) {
    archiveClassifier.set('plain')
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('javadoc', Javadoc) {
    options.links(
            'https://docs.gradle.org/current/javadoc/',
            'https://asm.ow2.io/asm50/javadoc/user/'
    )
}

tasks.named('validatePlugins') {
    enabled = false
}

tasks.register('javadocJar', Jar) {
    dependsOn tasks.named('javadoc')
    archiveClassifier.set('javadoc')
    from tasks.named('javadoc')
}

tasks.named('test', Test) {
    exclude '**'
}

license {
    ext {
        description = 'A Gradle plugin for the creation of Minecraft mods and MinecraftForge plugins.'
        year = '2013'
        fullname = 'Minecraft Forge'
    }

    header = rootProject.file('HEADER')

    include '**/net/minecraftforge/gradle/**/*.java'

    exclude '**/net/minecraftforge/gradle/util/ZipFileTree.java'
    exclude '**/net/minecraftforge/gradle/util/json/version/*'
    exclude '**/net/minecraftforge/gradle/util/patching/Base64.java'
    exclude '**/net/minecraftforge/gradle/util/patching/ContextualPatch.java'

    newLine = false
}

gradlePlugin {
    plugins {
        forgeGradle {
            id = 'dev.peak885.gradle.forge'
            implementationClass = 'net.minecraftforge.gradle.user.patcherUser.forge.ForgePlugin'
        }
    }
}

publishing {
    publications {
        forgeGradle(MavenPublication) {
            groupId = 'dev.peak885.gradle'
            artifactId = 'forge'
            version = project.version

            artifact(tasks.named('shadowJar'))
            artifact(tasks.named('javadocJar'))

            pom {
                name = 'ForgeGradleModern'
                description = 'A modernized ForgeGradle fork with Gradle 8 compatibility.'
                url = 'https://github.com/peaksuperior885/ForgeGradle-Modern'
            }
        }
    }

    repositories {
        maven {
            name = 'localBuild'
            url = layout.buildDirectory.dir('maven-repo')
        }
    }
}

tasks.named('publish') {
    dependsOn tasks.named('shadowJar')
}